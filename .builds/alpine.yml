image: alpine/edge
sources:
  - https://git.sr.ht/~rkta/w3m
packages:
  - ed
  - gc-dev
  - gpm-dev
  - imlib2-dev
  - libbsd-dev
  - libressl-dev
  - linux-headers
  - ncurses-dev
  - perl
  - tcc
  - tcc-libs-static
triggers:
  - action: email
    condition: always
    to: mail@rkta.de
environment:
  OPTS: '-Werror -Wno-stringop-overflow'
tasks:
  - default: |
      cd w3m
      make distclean || :
      ./configure
      make -j4
      test -x w3m
      cd t
      sh run
      cd -
      ./w3m -insecure -dump gemini://rkta.srht.site/w3m-gemini.gmi
