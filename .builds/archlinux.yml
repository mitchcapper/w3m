image: archlinux
sources:
  - https://git.sr.ht/~rkta/w3m
packages:
  - ed
  - gdk-pixbuf-xlib
  - imlib2
  - quilt
  - tcc
triggers:
  - action: email
    condition: always
    to: mail@rkta.de
environment:
  OPTS: '-Werror -flto -Wno-stringop-overflow'
tasks:
  - patches: |
      cd w3m
      printf "%s\n" '/BORKED/,$d' wq | ed -s patches/series
      quilt push -a
  - default: |
      cd w3m
      make distclean || :
      ./configure
      make -j4
      test -x w3m
      cd t
      sh run

  - debian: |
      cd w3m
      make distclean || :
      ./configure \
        --enable-alarm \
        --enable-ansi_color \
        --enable-color \
        --enable-cookie \
        --enable-external_uri_loader \
        --enable-gopher \
        --enable-image \
        --enable-ipv6 \
        --enable-m17n \
        --enable-menu \
        --enable-mouse \
        --enable-nls \
        --enable-nntp \
        --enable-sslverify \
        --enable-unicode \
        --enable-w3mmailer \
        --with-gc \
        --with-imagelib=imlib2 \
        --with-migemo="cmigemo -q -d /usr/share/cmigemo/utf-8/migemo-dict" \
        --with-ssl
      make -j4
      test -x w3m
      cd t
      sh run

  - gdk-pixbuf: |
      cd w3m
      make distclean || :
      ./configure \
        --enable-alarm \
        --enable-ansi_color \
        --enable-color \
        --enable-cookie \
        --enable-external_uri_loader \
        --enable-gopher \
        --enable-image \
        --enable-ipv6 \
        --enable-m17n \
        --enable-menu \
        --enable-mouse \
        --enable-nls \
        --enable-nntp \
        --enable-sslverify \
        --enable-unicode \
        --enable-w3mmailer \
        --with-gc \
        --with-imagelib=gdk-pixbuf \
        --with-migemo="cmigemo -q -d /usr/share/cmigemo/utf-8/migemo-dict" \
        --with-ssl
      make -j4
      test -x w3m
      cd t
      sh run

  - tcc: |
      cd w3m
      make distclean || :
      env CC=tcc ./configure \
        --enable-alarm \
        --enable-ansi_color \
        --enable-bgcolor \
        --enable-color \
        --enable-cookie \
        --enable-dict \
        --enable-digest_auth \
        --enable-external_uri_loader \
        --enable-gopher \
        --enable-help_cgi \
        --enable-history \
        --enable-image \
        --enable-ipv6 \
        --enable-japanese \
        --enable-keymap=w3m \
        --enable-m17n \
        --enable-menu \
        --enable-messagel10n \
        --enable-mouse \
        --enable-nls \
        --enable-nntp \
        --enable-sslverify \
        --enable-unicode \
        --enable-w3mmailer \
        --enable-xface \
        --with-browser \
        --with-editor \
        --with-gc \
        --with-imagelib=imlib2 \
        --with-mailer \
        --with-migemo="cmigemo -q -d /usr/share/cmigemo/utf-8/migemo-dict" \
        --with-ssl \
        --with-termlib \
        --with-x
      printf "%s\n" "/FORTIFY_SOURCE/d" "w" "q" | ed -s w3mimg/x11/Makefile
      printf "%s\n" "/FORTIFY_SOURCE/d" "w" "q" | ed -s w3mimg/win/Makefile
      printf "%s\n" "/FORTIFY_SOURCE/d" "w" "q" | ed -s w3mimg/fb/Makefile
      printf "%s\n" "/FORTIFY_SOURCE/d" "w" "q" | ed -s w3mimg/Makefile
      printf "%s\n" "/FORTIFY_SOURCE/d" "w" "q" | ed -s libwc/Makefile
      printf "%s\n" "/FORTIFY_SOURCE/d" "w" "q" | ed -s Makefile
      make -j4
      test -x w3m
      cd t
      sh run
